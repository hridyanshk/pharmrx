services:
  - type: web
    name: pharmrx
    runtime: node
    plan: free
    buildCommand: npm --prefix backend ci && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: npm --prefix backend run setup && npm --prefix backend start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
